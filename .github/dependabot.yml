# Automated dependency-update PRs so security advisories get surfaced and fixed.
#
# PRs target `main`, where all development lands. Every PR runs the CI workflow
# (.github/workflows/ci.yml: backend build, migrations and tests against Postgres;
# frontend type-check, build and lint), and every npm bump also runs Image check
# (.github/workflows/image-check.yml: the container images built and run on
# amd64 and arm64). Only MINOR and PATCH updates are grouped, and those groups,
# plus GitHub Actions bumps, are merged automatically once CI, and Image check
# where it ran, have passed on them (see .github/workflows/dependabot-auto-merge.yml
# and dependabot-merge-after-ci.yml). MAJOR bumps are deliberately left OUT of the
# groups so each breaking change arrives as its own PR to be reviewed and tested
# on its own (e.g. express 4→5, pinia 2→3, vue-router 4→5).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/backend"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @types/node stays on the major of the oldest Node the backend runs on
      # (backend/Dockerfile: node:22-alpine; CI's Node 22), so tsc rejects APIs
      # that Node lacks. Move it in the same change as the Dockerfile base image
      # and CI's Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # js-yaml stays on 4.x (the v4-legacy line): js-yaml 5 rejects
      # under-indented continuation lines that 4 accepts, which existing rules
      # and pasted Sigma contain. The frontend pins the same major so both
      # parse a rule the same way; move them together, after testing that.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Same as the backend: @types/node stays on the major of the Node the
      # frontend builds on (frontend/Dockerfile: node:22-alpine, CI's Node 22).
      # Move it in the same change as both.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3.12 and 3.3.13 lose template scope after a component prop
      # containing "//" (a URL), failing type-check on valid templates
      # (vuejs/language-tools#6240). Later versions still come through.
      - dependency-name: "vue-tsc"
        versions: ["3.3.12", "3.3.13"]
      # js-yaml stays on 4.x, the backend's major (see the backend entry): the
      # rule editor must parse YAML exactly as the backend does, and js-yaml 5
      # rejects under-indented continuation lines that 4 accepts.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
