# Build and test every PR into main (and main itself).
#
# backend:  npm ci, build, run every migration against a fresh Postgres, npm test
#           (the DB-backed suites run because Postgres is up), eslint (errors
#           fail; warnings don't).
# frontend: npm ci, vue-tsc type-check, production build, eslint (errors fail;
#           warnings don't).
#
# Dependabot PRs get a read-only token and no secrets here, which is all this
# needs. dependabot-merge-after-ci.yml merges low-risk Dependabot updates only
# after this workflow succeeds on them.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: siembox
          POSTGRES_USER: siembox
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siembox -d siembox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: siembox
      DB_USER: siembox
      DB_PASSWORD: changeme
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Node 22, not the images' Node 20: `npm test` passes a quoted glob
      # ("src/**/*.test.ts") to the test runner, and only Node >= 21 expands it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run migrations (twice, to prove they are idempotent)
        run: |
          npm run migrate
          npm run migrate
      - run: npm test
      - run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - run: npm run lint
