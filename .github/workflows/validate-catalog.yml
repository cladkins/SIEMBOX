name: Validate Catalog

# Least-privilege: this workflow only checks out + validates, so read-only.
permissions:
  contents: read

# Gate for community catalog submissions. Parsers under catalog/ must pass strict
# schema validation AND their own self-tests (run through the same
# parse->derive->normalize pipeline the app uses); detection rules under rules/
# must pass strict structural validation against the operators/shape the rules
# engine supports; content packs under catalog/packs/ must pass the pack schema
# and reference only parsers and detections that exist here; application
# signatures under catalog/applications/ must pass the signature schema, the
# ReDoS check and their own tests, and reference only parsers that exist here;
# suggested scans under catalog/scans/ must pass the suggestion schema (valid
# schedules, options the Scheduled Scans and scan-policy routes accept, no
# concrete targets, intrusive selections declared).
# Anything that passes here imports into SIEMBox cleanly.
on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'rules/**'
      - 'backend/src/services/parser/**'
      - 'backend/src/services/rules/**'
      - 'backend/src/scripts/validate-parsers.ts'
      - 'backend/src/scripts/validate-detections.ts'
      - 'backend/src/scripts/validate-packs.ts'
      - 'backend/src/services/packs/**'
      - 'backend/src/scripts/validate-applications.ts'
      - 'backend/src/services/applications/**'
      - 'backend/src/scripts/validate-scans.ts'
      - 'backend/src/services/scanSuggestions/**'
      - 'backend/src/services/scanner/scheduleOptions.ts'
      - 'backend/src/utils/scheduleTiming.ts'
      - '.github/workflows/validate-catalog.yml'
  push:
    branches: [main, develop]
    paths:
      - 'catalog/**'
      - 'rules/**'
      - 'backend/src/services/parser/**'
      - 'backend/src/services/rules/**'
      - 'backend/src/services/packs/**'
      - 'backend/src/services/applications/**'
      - 'backend/src/services/scanSuggestions/**'
      - 'backend/src/services/scanner/scheduleOptions.ts'
      - '.github/workflows/validate-catalog.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate parsers + detections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build validators
        working-directory: backend
        run: npm run build

      - name: Validate catalog parsers (strict + self-tests)
        working-directory: backend
        run: npm run validate-parsers -- ../catalog/parsers

      - name: Validate detection rules (strict)
        working-directory: backend
        run: npm run validate-detections -- ../rules

      - name: Validate content packs (strict, references resolve)
        working-directory: backend
        run: npm run validate-packs -- ../catalog/packs --parsers ../catalog/parsers --detections ../rules

      - name: Validate application signatures (strict, ReDoS, self-tests, parsers resolve)
        working-directory: backend
        run: npm run validate-applications -- ../catalog/applications --parsers ../catalog/parsers

      - name: Validate suggested scans (strict, schedules, options, no concrete targets)
        working-directory: backend
        run: npm run validate-scans -- ../catalog/scans
