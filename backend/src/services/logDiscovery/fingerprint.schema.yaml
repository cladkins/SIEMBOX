# JSON-schema-style contract for a fingerprint file.
# Claude Code: validate every fingerprints/*.yaml against this on load. Reject on failure.
required: [id, name, category, security_value, signals, confidence_floor, attack_data_sources, log_access, onboard_template, credentials]
properties:
  id: {type: string, pattern: "^[a-z0-9-]+$"}
  name: {type: string}
  category: {type: string}
  security_value: {type: integer, minimum: 1, maximum: 10}
  signals:
    type: object
    properties:
      ports:   {type: array, items: {required: [port, weight]}}
      http:    {type: array, items: {required: [path, weight]}}
      mdns:    {type: array, items: {required: [service, weight]}}
      ssdp:    {type: array}
      tls:     {type: array}
      mac_oui: {type: array}
  confidence_floor: {type: integer, minimum: 0, maximum: 100}
  attack_data_sources: {type: array, items: {type: string}}
  log_access: {type: array, minItems: 1, items: {required: [method]}}
  onboard_template: {type: string}
  credentials:
    type: object
    required: [required]
    properties:
      required: {type: boolean}
      optional: {type: array}
