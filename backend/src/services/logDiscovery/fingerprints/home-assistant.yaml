id: home-assistant
name: Home Assistant
category: home-automation
security_value: 6
signals:
  ports:
    - {port: 8123, weight: 40}
  http:
    - {path: /manifest.json, expect: "Home Assistant", weight: 50}
  mdns:
    - {service: _home-assistant._tcp, weight: 60}
  ssdp: []
  tls: []
  mac_oui: []
confidence_floor: 50
attack_data_sources:
  - authentication logs
  - application logs
log_access:
  # /api/error_log is the log file, which Home Assistant OS and Supervised
  # installs don't write; SIEMBox's poller falls back to the Supervisor's
  # /api/hassio/core/logs there on its own (apiPoll/adapters/homeAssistant.ts).
  - method: api_pull
    endpoint: /api/error_log
    auth: bearer_token
    target_port: 8123
    note: >-
      On Home Assistant OS and Supervised installs /api/error_log answers 404 (they
      write no log file); use /api/hassio/core/logs?no_colors there instead. Both
      endpoints need a long-lived access token created by an administrator
      (Profile, Security tab).
  - {method: file, path: /config/home-assistant.log}
onboard_template: templates/api_poller.j2
credentials:
  required: false
  optional:
    - {type: long_lived_token, unlocks: [api_pull]}
