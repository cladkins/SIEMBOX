schema: siembox.app/v1
id: debian
name: Debian
vendor: Debian
category: operating-system
description: Operating system.
website: https://www.debian.org
cpe: { vendor: debian, product: debian_linux }
match:
  dns: [deb.debian.org, security.debian.org]
  os:
    family: linux
    pretty_name: '^Debian GNU/Linux (\d+(?:\.\d+)?)'
tests:
  - source: os
    input: { family: linux, pretty_name: 'Debian GNU/Linux 12 (bookworm)' }
    version: '12'
  - source: dns
    input: deb.debian.org
