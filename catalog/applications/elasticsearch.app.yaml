schema: siembox.app/v1
id: elasticsearch
name: Elasticsearch
vendor: Elastic
category: database
description: Search and analytics engine.
website: https://www.elastic.co/elasticsearch
cpe: { vendor: elastic, product: elasticsearch }
match:
  syslog_program: [elasticsearch]
  container_image: [elasticsearch, '*/elasticsearch/elasticsearch', bitnami/elasticsearch]
  package: [elasticsearch]
tests:
  - source: syslog_program
    input: elasticsearch
  - source: container_image
    input: 'docker.elastic.co/elasticsearch/elasticsearch:8.12.0'
    version: '8.12.0'
  - source: package
    input: elasticsearch
