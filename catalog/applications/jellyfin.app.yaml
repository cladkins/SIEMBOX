schema: siembox.app/v1
id: jellyfin
name: Jellyfin
vendor: Jellyfin
category: media-server
description: Free software media server.
website: https://jellyfin.org
cpe: { vendor: jellyfin, product: jellyfin }
match:
  syslog_program: [jellyfin]
  parser: [jellyfin]
  container_image: [jellyfin/jellyfin, '*/jellyfin/jellyfin', linuxserver/jellyfin, '*/linuxserver/jellyfin']
  package: [jellyfin, jellyfin-server]
  user_agent:
    - '^Jellyfin-Server/(\d+(?:\.\d+)+)'
  dns: [repo.jellyfin.org]
tests:
  - source: syslog_program
    input: Jellyfin
  - source: parser
    input: jellyfin
  - source: container_image
    input: 'jellyfin/jellyfin:10.8.13'
    version: '10.8.13'
  - source: container_image
    input: 'ghcr.io/jellyfin/jellyfin:10.9.0'
    version: '10.9.0'
  - source: package
    input: jellyfin-server
  - source: user_agent
    input: Jellyfin-Server/10.8.13
    version: '10.8.13'
  - source: dns
    input: repo.jellyfin.org
