schema: siembox.app/v1
id: openssh
name: OpenSSH
vendor: OpenBSD
category: remote-access
description: 'SSH server (sshd).'
website: https://www.openssh.com
cpe: { vendor: openbsd, product: openssh }
match:
  syslog_program: [sshd, sshd-session]
  parser: [ssh-authentication]
  service:
    banner:
      - '^OpenSSH[_ ](\d+\.\d+(?:p\d+)?)'
  package: [openssh-server, openssh]
tests:
  - source: syslog_program
    input: sshd
  - source: syslog_program
    input: sshd-session
  - source: parser
    input: ssh-authentication
  - source: service
    input: { name: ssh, banner: OpenSSH 8.9p1 Ubuntu 3ubuntu0.6 }
    version: '8.9p1'
  - source: service
    input: { name: ssh }
    match: false
  - source: package
    input: openssh-server
