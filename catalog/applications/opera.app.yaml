schema: siembox.app/v1
id: opera
name: Opera
vendor: Opera
category: browser
description: Web browser.
website: https://www.opera.com
supersedes: [chrome]
match:
  user_agent:
    - '\bOPR/(\d+(?:\.\d+)*)'
tests:
  - source: user_agent
    input: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 OPR/106.0.0.0'
    version: '106.0.0.0'
