schema: siembox.app/v1
id: postfix
name: Postfix
vendor: Postfix
category: mail
description: Mail transfer agent.
website: https://www.postfix.org
cpe: { vendor: postfix, product: postfix }
match:
  syslog_program: ['postfix/*']
  service:
    banner:
      - '^Postfix smtpd'
  container_image: [boky/postfix]
  package: [postfix]
tests:
  - source: syslog_program
    input: postfix/smtpd
  - source: syslog_program
    input: postfix/qmgr
  - source: syslog_program
    input: postfix
    match: false
  - source: service
    input: { name: smtp, banner: Postfix smtpd }
    version: null
  - source: container_image
    input: 'boky/postfix:v4.1.0'
    version: '4.1.0'
  - source: package
    input: postfix
