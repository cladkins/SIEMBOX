schema: siembox.app/v1
id: uptime-kuma
name: Uptime Kuma
vendor: Louis Lam
category: monitoring
description: Self-hosted uptime monitor.
website: https://uptime.kuma.pet
match:
  container_image: [louislam/uptime-kuma]
  user_agent:
    - '^Uptime-Kuma/(\d+(?:\.\d+)+)'
tests:
  - source: container_image
    input: 'louislam/uptime-kuma:1.23.11'
    version: '1.23.11'
  - source: user_agent
    input: Uptime-Kuma/1.23.11
    version: '1.23.11'
