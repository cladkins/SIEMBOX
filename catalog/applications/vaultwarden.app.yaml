schema: siembox.app/v1
id: vaultwarden
name: Vaultwarden
vendor: Vaultwarden
category: password-manager
description: Bitwarden-compatible password manager server.
website: https://github.com/dani-garcia/vaultwarden
match:
  syslog_program: [vaultwarden]
  parser: [vaultwarden-access]
  container_image: [vaultwarden/server, '*/vaultwarden/server']
  package: [vaultwarden]
tests:
  - source: syslog_program
    input: vaultwarden
  - source: parser
    input: vaultwarden-access
  - source: container_image
    input: 'vaultwarden/server:1.30.1-alpine'
    version: '1.30.1'
  - source: package
    input: vaultwarden
