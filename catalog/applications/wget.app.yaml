schema: siembox.app/v1
id: wget
name: GNU Wget
vendor: GNU
category: http-client
description: Command-line downloader.
website: https://www.gnu.org/software/wget/
cpe: { vendor: gnu, product: wget }
match:
  package: [wget]
  user_agent:
    - '^Wget/(\d+(?:\.\d+)*)'
tests:
  - source: user_agent
    input: Wget/1.21.2
    version: '1.21.2'
  - source: package
    input: wget
