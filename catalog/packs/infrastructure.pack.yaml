setup:
  - title: Ship each host's system logs
    text: |
      Run a SIEMBox log shipper on each Linux host. On systemd hosts mount the
      journal and add a **Systemd Journal** source with the unit left blank (the
      whole journal). On rsyslog hosts mount `/var/log` and click **Add System
      Log Files** on the shipper: it adds `/var/log/syslog`, `/var/log/messages`
      and `/var/log/auth.log`, skipping the ones a host does not have.
    code: |
      services:
        siembox-shipper:
          volumes:
            - /var/log/journal:/var/log/journal:ro   # journald hosts
            - /var/log:/var/log:ro                   # rsyslog hosts
    code_language: yaml
  - title: Or forward syslog directly
    text: |
      A host (or a network appliance) can send syslog straight to SIEMBox on port
      514 UDP/TCP instead. With rsyslog, one line in a drop-in file does it;
      restart rsyslog afterwards.
    code: |
      # /etc/rsyslog.d/90-siembox.conf  (@@ = TCP, @ = UDP)
      *.* @@siembox-host:514
    code_language: conf
  - title: fail2ban
    text: |
      fail2ban logs bans to `/var/log/fail2ban.log` by default. Add a **File**
      source for it (it is inside the `/var/log` mount above).
  - title: Check that events arrive
    text: |
      Run `sudo true` on a host. On **Logs** the line shows with the
      `linux-sudo` parser, with the user and command. Lines no specific parser
      knows land on `generic-syslog`, the catch-all, so nothing is dropped before
      you add a parser for them.
  - title: About the SigmaHQ rules
    text: |
      The pack adds SigmaHQ's Linux keyword rules (reverse shells, `/dev/tcp`,
      log clearing, `ld.so` preload, crontab changes, new privileged users and
      others). They search the message of each log line, so they need the
      host's syslog or journal. They install through the SigmaHQ library,
      enabled; refresh the library on **Detection Rules > SigmaHQ** if the pack
      shows them as pending.
