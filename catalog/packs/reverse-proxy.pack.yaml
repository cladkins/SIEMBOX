setup:
  - title: Write the access log in a format SIEMBox parses
    text: |
      nginx and Apache: the default `combined` format. Traefik: JSON access logs.
      Caddy: its structured JSON access log (`log` directive inside the site
      block). Make sure the **real client IP** is logged, not the address of a
      load balancer or tunnel in front, or geo and threat-feed enrichment will see
      only that hop.
    code: |
      # Traefik (static configuration)
      accessLog:
        filePath: /var/log/traefik/access.log
        format: json
    code_language: yaml
  - title: Ship the logs
    text: |
      Point a SIEMBox log shipper at the log files (a **File** source per path,
      wildcards allowed) or, for a container that logs to stdout, add a **Docker**
      source with the container name. Mount the log directory into the shipper
      read-only. nginx error logs ship the same way; add them too, the error
      parser and the core-dump rule read them.
    code: |
      services:
        siembox-shipper:
          volumes:
            - /var/log/nginx:/var/log/nginx:ro
            - /var/log/traefik:/var/log/traefik:ro
      # Shipper sources: /var/log/nginx/access.log, /var/log/nginx/error.log,
      #                  /var/log/traefik/access.log
    code_language: yaml
  - title: Behind Cloudflare or another proxy
    text: |
      If your proxy sits behind a CDN or tunnel, have nginx take the client IP
      from the header that hop sets (`real_ip_header` with `set_real_ip_from`
      for the hop's ranges), or set Traefik's `forwardedHeaders.trustedIPs` on the
      entry point. Otherwise every request appears to come from the CDN.
    code: |
      # nginx (http block)
      set_real_ip_from 173.245.48.0/20;   # one line per range of the hop in front
      real_ip_header CF-Connecting-IP;
    code_language: nginx
  - title: Check that requests arrive
    text: |
      Request a page through the proxy, then open **Logs** and filter on the
      parser (for example `traefik-access`). The event should carry the client
      IP, method, path, status code and user agent. A request with
      `curl -A sqlmap https://your-site/` should fire the hack-tool user-agent
      rule once the pack is installed.
  - title: About the SigmaHQ rules
    text: |
      The pack adds SigmaHQ's web attack-string rules (SQL injection, XSS,
      template injection, JNDI and Java payloads, webshell strings, source-code
      enumeration), scanner and malware user-agent rules, and server fault rules.
      They install through the SigmaHQ library, enabled; refresh the library on
      **Detection Rules > SigmaHQ** if the pack shows them as pending.
