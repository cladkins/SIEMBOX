schema: siembox.pack/v1
id: reverse-proxy
name: Reverse Proxy & Web
description: nginx / Traefik / Caddy access + error logs with path-traversal, enumeration, bad-bot, and method-abuse rules.
icon: Connection
# Bump whenever parsers, detections or sigma change (installs show the difference as "What's new").
version: 2
parsers:
  - standard-nginx-access
  - standard-nginx-error
  - traefik-access
  - caddy-access
  - apache-nginx-access-log
  - nginx-komodo-ip-only
  - nginx-komodo-timestamp-first
  - nginx-komodo-error
detections:
  categories: [reverse-proxy]
