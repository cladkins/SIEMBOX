schema: siembox.scan/v1
id: asset-port-scan-weekly
name: Weekly open-port scan (top 1000 TCP)
kind: asset
category: services
tags: [nmap, ports]
description: >-
  An Nmap TCP connect scan of ports 1-1000 on every host in your subnets, once
  a week, recording open ports per asset.
why: >-
  Shows what each host exposes and catches a service that was opened without
  anyone noticing (an admin panel, a database port). Weekly on a Sunday night
  keeps the load off working hours.
intrusive: false
load: moderate
schedule:
  frequency: weekly
  days: [0]
  time: "02:00"
options:
  scanType: port
inputs:
  - field: targets
    label: Subnets or hosts
    hint: The networks or hosts to scan, as IPs or CIDRs.
  - field: shipper
    label: Run from
    hint: A log shipper on that network, if SIEMBox cannot reach it.
