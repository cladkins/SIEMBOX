# SIEMBox Development Compose File
# Builds containers from source code
#
# For production deployments using pre-built GHCR images, use:
#   docker compose -f compose.prod.yaml up -d
#
# For local development:
#   docker compose up -d --build

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: siembox-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-siembox}
      POSTGRES_USER: ${DB_USER:-siembox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable from this host, never the LAN (the password
      # defaults to "changeme"). Needed so a backend running with the optional
      # network_mode: host below (which drops it off siembox-network entirely)
      # can still reach Postgres via DB_HOST=localhost. To reach the database
      # from another machine, use an SSH tunnel rather than widening this.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-siembox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siembox-network
    restart: unless-stopped

  # Backend API and Syslog Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siembox-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8421}
      HOST: 0.0.0.0
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: 5432
      # Set to true only alongside the optional network_mode: host below --
      # tells Log Discovery it can trust the host's real detected network
      # interface instead of the Docker bridge. See the comment on
      # network_mode below.
      SIEMBOX_HOST_NETWORKING: ${SIEMBOX_HOST_NETWORKING:-}
      DB_NAME: ${DB_NAME:-siembox}
      DB_USER: ${DB_USER:-siembox}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-changeme}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Client addresses (DEPLOYMENT.md, "Client addresses and reverse proxies").
      # X-Forwarded-For is believed only from the bundled frontend, over the
      # api-socket volume below or by its service name, and from what this
      # lists: IPs, CIDRs or Compose service names, comma-separated. The value
      # replaces the default, so to add your reverse proxy keep `frontend`:
      #   TRUSTED_PROXIES=frontend,192.168.1.20
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-frontend}
      # Requests per 15 minutes per client address across /api (empty = 1000).
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-}
      # The EDR agent routes' and HTTP log pushes' own per-address limits per 15
      # minutes (empty = 30000 and 6000); raise them for a big fleet behind one
      # address.
      EDR_AGENT_RATE_MAX: ${EDR_AGENT_RATE_MAX:-}
      SHIPPER_LOG_PUSH_MAX: ${SHIPPER_LOG_PUSH_MAX:-}
      # The proxy socket for the frontend's nginx. Leave it empty
      # (/run/siembox/api.sock on the api-socket volume below, the only path
      # the bundled nginx connects to); `off` runs without the socket.
      SIEMBOX_PROXY_SOCKET: ${SIEMBOX_PROXY_SOCKET:-}
      # Sign-in protection (DEPLOYMENT.md, "Sign-in protection"). Empty = the
      # defaults: a pause after 5 failed sign-ins for an account from one
      # network, 20 from one network for any username, and 20 for an account
      # from new browsers on all networks (0 turns that last one off). Browsers
      # that signed in before are never paused by the last two.
      # LOGIN_PROTECTION=off stops all counting: only for getting back in
      # after a lockout (TROUBLESHOOTING.md, "Locked out of SIEMBox").
      LOGIN_PROTECTION: ${LOGIN_PROTECTION:-}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-}
      LOGIN_MAX_FAILURES_PER_ADDRESS: ${LOGIN_MAX_FAILURES_PER_ADDRESS:-}
      LOGIN_MAX_FAILURES_PER_ACCOUNT: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:-}
      # Alerts about attacks on sign-in (empty = on; `off`), and how many days
      # failed sign-in audit rows are kept (empty = 90; 0 keeps them).
      AUTH_ALERTS: ${AUTH_ALERTS:-}
      AUTH_FAILURE_AUDIT_RETENTION_DAYS: ${AUTH_FAILURE_AUDIT_RETENTION_DAYS:-}
      # EDR YARA rule packs (optional). Built-in starter bundle ships by default;
      # set EDR_YARA_FORGE_ENABLED=true to auto-import YARA-Forge Extended daily.
      EDR_YARA_FORGE_ENABLED: ${EDR_YARA_FORGE_ENABLED:-}
      EDR_YARA_KEEP_VERSIONS: ${EDR_YARA_KEEP_VERSIONS:-}
    volumes:
      - ./rules:/app/rules:ro  # Mount rules directory as read-only
      - ./nuclei-templates:/root/nuclei-templates  # Nuclei vulnerability templates (bind mount for easy customization)
      # The private channel from the frontend's nginx: the backend listens on
      # /run/siembox/api.sock, and only containers that mount this volume can
      # connect. Keep it in every network mode, host networking included.
      - api-socket:/run/siembox
    ports:
      # Ignored entirely once network_mode: host is enabled below -- comment
      # this block out too when you do.
      - "8421:8421"
      - "514:514/udp"  # Syslog UDP
      - "514:514/tcp"  # Syslog TCP
    depends_on:
      postgres:
        condition: service_healthy
    # OPTIONAL -- Host networking for Log Discovery (Linux only). Passive
    # discovery (ARP table read, mDNS, SSDP) can only ever see the network(s)
    # this container is attached to -- on the bridge network below, that's
    # just the Docker bridge subnet, not your real LAN. Host networking gives
    # the backend the host's own network stack instead. Bigger tradeoff than
    # the socket mount above: the container is no longer network-isolated
    # from the host. See DEPLOYMENT.md's "Log Discovery and Network
    # Visibility" section before enabling. To enable: comment out `networks:`
    # below AND the `ports:` block above, uncomment the line below, then set
    # DB_HOST=localhost, BACKEND_UPSTREAM=host.docker.internal:8421, and
    # SIEMBOX_HOST_NETWORKING=true in your .env file. Keep the api-socket
    # volume: it is what gives the web UI's users their real addresses here.
    # network_mode: host
    networks:
      - siembox-network
    restart: unless-stopped

  # Frontend (Vue.js + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: siembox-frontend
    environment:
      # nginx proxies /api over the api-socket volume below and falls back to
      # this TCP address while the socket is unavailable. Defaults to the
      # backend's Docker-DNS name on siembox-network. If you've enabled the
      # backend's optional network_mode: host above, set this to
      # host.docker.internal:8421 in your .env instead: it is still required
      # there, because nginx resolves it at startup (see DEPLOYMENT.md's "Log
      # Discovery and Network Visibility" section).
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8421}
    volumes:
      # The backend's proxy socket; read-only is enough to connect.
      - api-socket:/run/siembox:ro
    ports:
      - "8420:80"
    depends_on:
      - backend
    networks:
      - siembox-network
    # Lets the frontend reach the backend on the Docker host when the backend
    # is running with the optional network_mode: host. Unused/harmless
    # otherwise -- same mechanism the backend already uses to reach a
    # host-local Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  # Holds the backend's API socket for the frontend (see the backend's volumes).
  api-socket:
    driver: local

networks:
  siembox-network:
    driver: bridge
