name: Port Scan Detection
description: >
  Detects network port scanning reconnaissance activity. 10 connection attempts to 5+ different
  destination ports in 5 minutes indicates automated port scanning using tools like nmap, masscan,
  or zmap. Port scanning is reconnaissance phase before exploitation.
severity: medium
enabled: true
tags: [port-scan, scanning, reconnaissance, infrastructure, network, attack.t1046, attack.t1595.001]

conditions:
  - field: message
    operator: regex
    # Deliberately NOT flags: i. "SYN" is a TCP flag written in caps, and a
    # case-insensitive "syn" matches ordinary words — "syntax error" would
    # alert as a port scan. The prose phrases get explicit case classes instead,
    # because logs capitalise them inconsistently ("Connection refused" is the
    # canonical form in most daemons, and was missed entirely).
    # "Port, then later closed" is written so the gap cannot contain "Port"
    # again, not as [Pp]ort.*[Cc]losed: that form is polynomial ReDoS and
    # SIEMBox refuses to store it. Same matches on a single line.
    value: '([Cc]onnection [Rr]efused|[Cc]onnection [Aa]ttempt|SYN|[Pp]ort(?:[^Pp\n\r]|[Pp](?!ort))*[Cc]losed|[Nn]o [Rr]oute [Tt]o [Hh]ost)'

aggregation:
  field: source_ip
  timeframe: 5m
  threshold: 10

alert:
  title: "Port Scan Detected from {source_ip}"
  description: >
    {count} connection attempts from {source_ip} in 5 minutes. Possible port scanning activity detected.
    Review connection patterns, check source IP reputation, and block IP if malicious.
